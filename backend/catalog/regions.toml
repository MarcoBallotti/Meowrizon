# Regioni di atterraggio di Meowrizon: solo le regioni candidate di Artemis III.
#
# Qui si decide QUALI regioni usare. I contorni non si scrivono a mano: li scarica da Moon Trek
#   docker compose run --rm backend python -m app.cli init-regions
# Fonti tra parentesi quadre: elenco in docs/criteri-algoritmo.md.
#
# Campi di ogni regione:
#   id              identificativo stabile, minuscolo con trattini
#   name            nome NASA
#   moontrek_label  etichetta ESATTA del layer Moon Trek A3_Named_regions_SP [F3], obbligatoria:
#                   senza contorno pubblicato una regione non entra nel catalogo
#   lists           liste NASA in cui compare: "2022" (13 regioni) [F3], "2024" (9 regioni) [F4]
#   active          true = il programma la valuta; false = nota, ma non calcolata

[sector]
name = "Polo sud"
# Entro 6° di latitudine dal polo sud: requisito di atterraggio Artemis III [F1, slide 21].
# Decisione D1. Una regione è accettata se almeno una parte sta a sud di questo limite.
lat_limit = -84.0

[grid]
# Pendenza di atterraggio misurata su 100 m e precisione di atterraggio di 100 m [F1, slide 21 e 28].
cell_size_m = 100

