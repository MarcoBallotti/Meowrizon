# Siti di Meowrizon: punti mostrati sulla mappa all'apertura dell'app e valutati come una cella
# di 100 × 100 m (precisione di atterraggio richiesta da Artemis III [F1, slide 28]).
# Fonti tra parentesi quadre: elenco in docs/piano-logica.md.
#
# Scelta del team (14/11/2026):
#   - "atterrato": atterraggi RIUSCITI tra i più conosciuti dal pubblico, cioè tutti quelli con
#     equipaggio più le missioni robotiche con un primato storico. Niente atterraggi falliti né
#     riusciti solo in parte (IM-1, IM-2 e SLIM si sono rovesciati);
#   - "previsto": missioni CLPS future. Non hanno ancora un punto di atterraggio pubblicato, quindi
#     il punto è il CENTRO DELLA FORMAZIONE BERSAGLIO (Gazetteer IAU o regione Artemis):
#     indica la zona, non il punto in cui atterreranno.
#
# Regole per aggiungere un sito:
#   - "source" è obbligatoria (fonte delle coordinate): il comando init-regions rifiuta un sito senza;
#   - coordinate planetocentriche nel sistema Mean Earth, sfera di 1737,4 km, in gradi decimali:
#     latitudine negativa a sud, longitudine Est in 0…360 o −180…180, scritte come nella fonte;
#   - il sito può stare ovunque sulla Luna. Il limite del settore (regions.toml) vale solo per le
#     regioni: un sito fuori dal settore ha in_sector = false e il suo terreno verrà da un DEM globale;
#   - la quota non si scrive: si leggerà dal DEM.
#
# Campi: id, name, lat, lon, kind ("atterrato" | "previsto" | "personalizzato"), source,
#        date (facoltativa, AAAA-MM-GG UTC, data di atterraggio), note (facoltativa)
#
# Fonti delle coordinate:
#   [MT-S] Moon Trek, layer "Lunar Anthropogenic Impacts and Spacecraft Sites", atterraggi morbidi
#          (dati NSSDCA, layer del 7/11/2022):
#          https://trek.nasa.gov/moon/trekarcgis2/rest/services/Lunar_Landing_Impact_Sites/MapServer/1/query?where=1%3D1&outFields=*&returnGeometry=true&outSR=4326&f=json
#   [MT-C] stesso layer, atterraggi con equipaggio (stadio di discesa del LM):
#          https://trek.nasa.gov/moon/trekarcgis2/rest/services/Lunar_Landing_Impact_Sites/MapServer/2/query?where=1%3D1&outFields=*&returnGeometry=true&outSR=4326&f=json
#   [LROC] pagine del team LROC, posizione del lander misurata nelle immagini di LRO
#   [IAU]  USGS Gazetteer of Planetary Nomenclature, centro della formazione:
#          https://planetarynames.wr.usgs.gov/shapefiles/MOON_nomenclature_center_pts.zip
#
# Coordinate lette il 14/11/2026.

