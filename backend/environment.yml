name: meowrizon
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  # API
  - fastapi>=0.115,<1
  - uvicorn>=0.30,<1
  # Raster e calcolo numerico
  - gdal>=3.10,<4
  - rasterio>=1.4,<2
  - numpy>=2,<3
  - scipy>=1.14,<2          # zona continua più grande (scipy.ndimage.label)
  # Geometria e proiezioni lunari
  - pyproj>=3.7,<4          # stereografica polare lunare <-> lat/lon
  - shapely>=2,<3           # celle dentro il poligono di una regione
  # HTTP verso Horizons, Moon Trek e PDS (anche per il TestClient di FastAPI)
  - httpx>=0.27,<1
  # Sviluppo
  - pytest>=8
  - ruff>=0.8
