name: meowrizon

# Sviluppo:   docker compose up --build             -> backend :8000, frontend :5173
# Produzione: docker compose --profile prod up --build web   -> web (nginx) :8080

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: meowrizon-backend:dev
    env_file:
      - path: .env
        required: false
    environment:
      MEOWRIZON_DATA_DIR: /app/data
      # Su Windows le modifiche ai file montati non arrivano come eventi:
      # il ricaricamento automatico controlla i file a intervalli. Su macOS e Linux
      # si può spegnere con WATCH_POLLING=false in .env.
      WATCHFILES_FORCE_POLLING: ${WATCH_POLLING:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Codice montato per il ricaricamento automatico in sviluppo.
      - ./backend:/app/backend
      # Dati scaricati e cache: restano sul disco, fuori dall'immagine e fuori da Git.
      - ./data:/app/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    image: meowrizon-frontend:dev
    environment:
      # Vite inoltra /api al backend dentro la rete Docker (vite.config.ts).
      MEOWRIZON_API_ORIGIN: http://backend:8000
      # Come per il backend: su Windows Vite deve controllare i file a intervalli.
      MEOWRIZON_WATCH_POLLING: ${WATCH_POLLING:-true}
      # demo = dati dimostrativi; api = motore Python. Si cambia in .env.
      VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-api}
      VITE_API_BASE_URL: /api
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Sorgenti montati per il ricaricamento automatico.
      - ./frontend:/app/frontend
      # Le dipendenze restano quelle Linux dell'immagine, non quelle eventualmente installate
      # su Windows. Dopo aver cambiato package.json: docker compose up --build -V frontend
      - /app/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy

  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-api}
        VITE_API_BASE_URL: /api
    image: meowrizon-web:latest
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
