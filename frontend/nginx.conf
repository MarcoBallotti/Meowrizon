# Frontend compilato servito da nginx; /api inoltrato al backend senza cambiare il percorso
# (contratto: base URL /api, backend/API_CONTRACT.md).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Le analisi del terreno possono richiedere tempo.
        proxy_read_timeout 300s;
    }

    # File di CesiumJS (worker, asset, widget): non cambiano finché non cambia la versione.
    location /cesium/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # L'app usa il routing con # (per esempio #/kit): ogni altro percorso torna a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
